name: Backend CI

on:
  push:
    branches: [main, dev]
    paths: ["api/**"]
  pull_request:
    paths: ["api/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ethio_listings_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check api/
          ruff format --check api/

      - name: Run tests
        env:
          DATABASE_URL: postgis://postgres:postgres@localhost:5432/ethio_listings_test
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
          DEBUG: "True"
          ALLOWED_HOSTS: localhost
        run: cd api && pytest --cov=apps --cov-report=term-missing
