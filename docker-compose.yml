services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ethio_listings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    depends_on:
      - db
      - redis

  worker:
    build: ./api
    command: celery -A config worker -l info
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env
    depends_on:
      - db
      - redis

  web:
    build: ./web
    command: npm run dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env.local
    depends_on:
      - api

volumes:
  postgres_data:
